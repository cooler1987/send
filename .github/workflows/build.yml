name: Pure Single File Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= 安卓构建（云端自动生成 Android 壳并打包） =================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 1. 自动生成标准安卓工程结构（保证是最新规范，不会再有 v1 embedding 报错）
      - name: 自动补齐原生平台壳工程
        run: |
          flutter create . --platforms=android --project-name=lan_drop

      # 2. 自动注入网络与摄像头权限
      - name: 自动注入权限配置
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle

      # 3. 依赖并打包
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk LanDrop-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LanDrop-Android.apk

  # ================= Windows 构建（云端自动生成 Windows 壳并打包） =================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 自动生成标准 Windows 工程结构
      - name: 自动补齐 Windows 平台壳工程
        run: |
          flutter create . --platforms=windows --project-name=lan_drop

      - run: flutter pub get
      - run: flutter build windows --release

      - name: 压缩为 PC 绿色免安装包
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath LanDrop-Windows-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: LanDrop-Windows-Portable.zip

  # ================= 自动挂载成品到 Releases =================
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            LanDrop-Android.apk
            LanDrop-Windows-Portable.zip
