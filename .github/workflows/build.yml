name: Pure Single File Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= 安卓构建 =================
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 锁定稳定版 Flutter，杜绝 Gradle 激进升级 Bug
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      # 1. 彻底清除仓库里可能残存的旧 android 目录，确保 100% 纯净生成
      - name: 生成纯净原生工程
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=lan_drop

      # 2. 仅向 AndroidManifest.xml 追加权限，绝不去碰 build.gradle.kts
      - name: 注入安卓权限
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

      # 3. 编译打包
      - name: 编译 APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: 重命名并保存产物
        run: mv build/app/outputs/flutter-apk/app-release.apk LanDrop-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: LanDrop-Android.apk

  # ================= Windows 构建（云端自动生成 Windows 壳并打包） =================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 自动生成标准 Windows 工程结构
      - name: 自动补齐 Windows 平台壳工程
        run: |
          flutter create . --platforms=windows --project-name=lan_drop

      - run: flutter pub get
      - run: flutter build windows --release

      - name: 压缩为 PC 绿色免安装包
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath LanDrop-Windows-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: LanDrop-Windows-Portable.zip

  # ================= 自动挂载成品到 Releases =================
  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            LanDrop-Android.apk
            LanDrop-Windows-Portable.zip
