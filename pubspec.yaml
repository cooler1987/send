name: lan_drop
description: "High performance LAN transfer tool for Android & Windows"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 文件选择与保存路径
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  path: ^1.9.0
  # 二维码生成与扫描
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3 # 仅在 Android 上调用摄像头
  # 校验与数据流
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
